name: Publish Python wheel

on:
  workflow_dispatch:

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter agent-improvement-console-ui run build
      - run: OPENORBIT_SKIP_FRONTEND_BUILD=1 uv build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*.whl
          if-no-files-found: error

  verify-wheel:
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: dist
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.13 "$RUNNER_TEMP/openorbit-wheel"
      - run: uv pip install --python "$RUNNER_TEMP/openorbit-wheel/bin/python" dist/*.whl
      - run: >-
          "$RUNNER_TEMP/openorbit-wheel/bin/python" -c "from app.main import app; from orbit.cli import main; print('wheel import OK')"

  publish-pypi:
    needs: verify-wheel
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openorbit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
